<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景の円 -->
  <circle cx="400" cy="200" r="150" fill="#f3f4f6">
    <animate attributeName="r" values="150;160;150" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- メインの図形 -->
  <path d="M300,200 L500,200 L400,300 Z" fill="#4f46e5">
    <animate attributeName="d" values="M300,200 L500,200 L400,300 Z;
              M300,200 L500,200 L400,280 Z;
              M300,200 L500,200 L400,300 Z" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- 装飾的な要素 -->
  <circle cx="400" cy="200" r="20" fill="#818cf8">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- テキスト -->
  <text x="400" y="180" text-anchor="middle" font-size="24" fill="#1f2937">
    Welcome to My Blog
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" />
  </text>
</svg>